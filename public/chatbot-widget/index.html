<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <script>
      // Get survey ID from URL
      const urlParams = new URLSearchParams(window.location.search);
      const surveyId = urlParams.get('surveyId');
      
      // Expose survey ID to the window object for the chatbot to access
      window.surveyContext = {
        surveyId: surveyId
      };
      
      // Log the survey ID for debugging
      if (surveyId) {
        console.log('Chatbot loaded for survey:', surveyId);
      }
    </script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Auth Modal -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-modal">
            <div class="auth-header">
                <h2>Welcome to AI Assistant</h2>
                <p>Please sign in to continue</p>
            </div>
            
            
            <!-- Email Sign In Form -->
            <form id="emailAuthForm" class="auth-form active">
                <div class="form-group">
                    <label for="userName">Full Name</label>
                    <input type="text" id="userName" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="userEmail">Email</label>
                    <input type="email" id="userEmail" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="auth-button primary">Continue</button>
                <div class="auth-divider">
                    <span>or</span>
                </div>
                <button type="button" class="auth-button google" id="googleSignIn">
                    <i class="fab fa-google"></i> Continue with Google
                </button>
                <div class="auth-footer">
                    <p>By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
                </div>
            </form>
        </div>
    </div>

    <div class="chatbot-container" style="display: none;">
        <div id="connectionStatus" class="connection-status">Connecting...</div>
        <div class="chatbot-header">
            <div class="header-content">
                <div class="header-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="header-info">
                    <h3>AI Assistant</h3>
                    <div class="status">Online</div>
                </div>
            </div>
            <div class="header-actions">
            </div>
        </div>

        <div class="chat-window" id="chatWindow">
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be added here dynamically -->
            </div>
            
            <div class="chat-input-container">
                <div class="input-wrapper">
                    <div class="input-actions">
                        <button class="input-btn" title="Add attachment">
                            <i class="fas fa-paperclip"></i>
                        </button>
                    </div>
                    <input type="text" id="userInput" placeholder="Type a message..." />
                    <button class="input-btn emoji-btn" title="Choose emoji">
                        <i class="far fa-smile"></i>
                    </button>
                </div>
                <button id="sendButton" class="send-button" title="Send message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
      // Update chat title if survey ID is available
      if (window.surveyContext?.surveyId) {
        const chatTitle = document.querySelector('.header-info h3');
        if (chatTitle) {
          chatTitle.textContent = `Survey #${window.surveyContext.surveyId} Assistant`;
        }
      }
    </script>
    <script src="js/chatbot.js"></script>
</body>
</html>
